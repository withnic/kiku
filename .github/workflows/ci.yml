# Cross-platform CI for kiku (Linux / macOS / Windows)
name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false  # Report results for all OS targets
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -v -race ./...

      # Build the CLI and dogfood kiku against its own workflow files
      - name: Build and self-check workflows
        shell: bash
        run: |
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ext=".exe"
          fi
          go build -o "bin/kiku${ext}" ./cmd/kiku
          "./bin/kiku${ext}" version
          "./bin/kiku${ext}" check --format github .github/
